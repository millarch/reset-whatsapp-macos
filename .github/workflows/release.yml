name: Release

# Builds, verifies, packages, and publishes the app whenever a version tag
# (for example v2.2.0) is pushed. The tag must match CFBundleShortVersionString
# in Resources/Info.plist. The zip is created with ditto without resource forks,
# extended attributes, or quarantine data, so it carries no local metadata, and
# a SHA256SUMS.txt file is attached so downloads can be verified.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check that the tag matches the app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match CFBundleShortVersionString ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build app
        run: ./Scripts/build.sh

      - name: Verify app
        run: ./Scripts/verify.sh

      - name: Package
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --keepParent --norsrc --noextattr --noqtn \
            "build/Reset WhatsApp.app" "dist/Reset-WhatsApp-${VERSION}.zip"
          /bin/cp "dist/Reset-WhatsApp-${VERSION}.zip" dist/Reset-WhatsApp.zip
          cd dist
          /usr/bin/shasum -a 256 Reset-WhatsApp-"${VERSION}".zip Reset-WhatsApp.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          {
            cat .github/release-notes.md
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo 'Built by GitHub Actions from the tagged source. Verify with `shasum -a 256 Reset-WhatsApp.zip`.'
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Reset WhatsApp ${VERSION}" \
            --notes-file dist/notes.md \
            --verify-tag \
            "dist/Reset-WhatsApp-${VERSION}.zip" \
            dist/Reset-WhatsApp.zip \
            dist/SHA256SUMS.txt
